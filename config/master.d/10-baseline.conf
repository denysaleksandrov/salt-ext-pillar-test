# Baseline: stock Salt ext_pillar modules, no custom code.
# Requires psycopg2 in the master's Python: `salt-pip install psycopg2-binary`.

# Stock `postgres` module: one global connection, keys host/port/user/pass/db only
# (no sslmode, no timeouts). The password lives here in plaintext.
postgres:
  host: pg.example.com
  port: 5432
  user: salt_pillar
  pass: CHANGE_ME
  db: salt

ext_pillar:
  # `%s` is the minion_id (the only bind parameter). `as_json` merges each
  # jsonb row directly; defaults first, then the minion's own rows.
  - postgres:
      - query: >-
          SELECT data FROM pillar_data
           WHERE target IN ('default', %s)
           ORDER BY (target <> 'default'), priority
        as_json: True

  # Stock `http_json` exists in Salt 3006/3007 ONLY (removed from core in 3008).
  # GET only, basic auth only, no TLS/CA/timeout options, returns {} on error.
  # Never use `with_grains: True` - grains are set by the minion and spoofable.
  # - http_json:
  #     url: https://cmdb.example.com/api/v1/pillar/%s
  #     namespace: cmdb
