# Custom ext_pillars from _pillar/ (pg_pillar, http_pillar).
# Deploy: copy _pillar/*.py to <file_roots>/_pillar/ and run
#   salt-run saltutil.sync_pillar
# or copy them to <extension_modules>/pillar/, then restart salt-master.

pg_pillar:
  profiles:
    main:
      host: pg.example.com
      port: 5432
      dbname: salt
      user: salt_pillar
      password_file: /etc/salt/secrets/pg_pillar.pw   # or password_env: PG_PILLAR_PW
      sslmode: verify-full
      sslrootcert: /etc/salt/pki/pg-ca.pem
      connect_timeout: 5
      statement_timeout_ms: 5000

ext_pillar:
  - pg_pillar:
      profile: main
      queries:
        - >-
          SELECT data FROM pillar_data
           WHERE target IN ('default', %(minion_id)s)
           ORDER BY (target <> 'default'), priority

  - http_pillar:
      url: https://cmdb.example.com/api/v1/pillar/{minion_id}
      namespace: cmdb
      bearer_token_file: /etc/salt/secrets/cmdb.token
      ca_bundle: /etc/salt/pki/cmdb-ca.pem
      timeout: [5, 15]

# Optional: cut DB/API load by caching rendered pillar on the master.
# The disk backend writes rendered pillar (including secrets) to the cachedir.
# pillar_cache: True
# pillar_cache_ttl: 300
# pillar_cache_backend: memory
