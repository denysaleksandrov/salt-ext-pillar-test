# Local variant of config/master.d/10-baseline.conf (podman postgres from dev/pg.sh).
postgres:
  host: 127.0.0.1
  port: 55432
  user: salt_pillar
  pass: salt_pillar
  db: salt

ext_pillar:
  - postgres:
      - query: >-
          SELECT data FROM pillar_data
           WHERE target IN ('default', %s)
           ORDER BY (target <> 'default'), priority
        as_json: True
