# Local variant of config/master.d/20-custom.conf
# (podman postgres from dev/pg.sh, API from dev/mock_api.py --token devtoken).
pg_pillar:
  profiles:
    main:
      host: 127.0.0.1
      port: 55432
      dbname: salt
      user: salt_pillar
      password_env: PG_PILLAR_PW
      sslmode: disable
      connect_timeout: 3
      statement_timeout_ms: 2000

ext_pillar:
  - pg_pillar:
      profile: main
      queries:
        - >-
          SELECT data FROM pillar_data
           WHERE target IN ('default', %(minion_id)s)
           ORDER BY (target <> 'default'), priority

  - http_pillar:
      url: http://127.0.0.1:8088/pillar/{minion_id}
      namespace: cmdb
      bearer_token_file: __RUN_DIR__/api.token
      timeout: [2, 5]
